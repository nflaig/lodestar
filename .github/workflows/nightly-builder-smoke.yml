name: Kurtosis Builder Nightly Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # 2 am UTC

concurrency:
  group: builder-nightly
  cancel-in-progress: false

env:
  ENCLAVE: builder-dev
  BUILDER_CONTAINER: lodestar-builder
  # host port the builder metrics are published on, non-default to avoid clashing with local metrics ports
  BUILDER_METRICS_PORT: 5077
  # Pinned by hand rather than via the ethpandaops action (used by the sim tests)
  # so a red nightly can only mean a Lodestar change, not an upstream Kurtosis release.
  KURTOSIS_VERSION: "1.20.0"

jobs:
  test:
    name: Build and run Kurtosis builder setup
    runs-on: warp-ubuntu-2204-x64-4x
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Kurtosis
        run: |
          echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" \
            | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y "kurtosis-cli=${KURTOSIS_VERSION}"
          kurtosis analytics disable

      - name: Build image, start devnet and builder
        run: ./scripts/kurtosis/run-builder.sh

      - name: Run builder smoke check
        run: |
          set -euo pipefail

          BN_URL="$(kurtosis port print "$ENCLAVE" cl-1-lodestar-geth http)"
          METRICS_URL="localhost:$BUILDER_METRICS_PORT/metrics"

          # wait for BN to be healthy
          timeout 120 bash -c "until curl -sf $BN_URL/eth/v1/node/health >/dev/null; do sleep 3; done"

          START_FINALIZED="$(curl -sf "$BN_URL/eth/v1/beacon/states/head/finality_checkpoints" \
            | jq -r .data.finalized.epoch)"

          alive() { [ "$(docker inspect -f '{{.State.Running}}' "$BUILDER_CONTAINER" 2>/dev/null)" = "true" ]; }
          died() { echo "builder $1"; exit 1; }
          export -f alive

          # readiness: metrics server up (bounded to ~4 minimal epochs)
          timeout 240 bash -c "until curl -sf $METRICS_URL >/dev/null; do alive || exit 1; sleep 3; done"
          alive || died "exited before metrics server came up"

          # builder reaches active (status gauge is set once per epoch)
          timeout 360 bash -c \
            "until curl -sf $METRICS_URL | grep -q '^bc_builder_status 1$'; do alive || exit 1; sleep 6; done"
          alive || died "exited before becoming active"

          # soak ~3 epochs
          for _ in $(seq 1 24); do
            alive || died "exited during soak"
            sleep 6
          done

          END_FINALIZED="$(curl -sf "$BN_URL/eth/v1/beacon/states/head/finality_checkpoints" \
            | jq -r .data.finalized.epoch)"
          if [ "$END_FINALIZED" -le "$START_FINALIZED" ]; then
            echo "finality did not advance ($START_FINALIZED -> $END_FINALIZED)"; exit 1
          fi

          # log levels are colored, strip the color codes to match them
          docker logs "$BUILDER_CONTAINER" 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' > builder.log
          if grep -qE '\]\s+error:' builder.log; then
            echo "error-level lines in builder.log"; exit 1
          fi

          # the builder is the only bidder, it must have won bids and revealed their payloads
          metric() { curl -sf "$METRICS_URL" | awk -v name="$1" '$1 == name {print $2}'; }
          BIDS="$(metric 'bc_builder_bids_total{result="published"}')"
          WINS="$(metric 'bc_builder_bids_won_total')"
          REVEALS="$(metric 'bc_builder_reveals_total{result="published"}')"
          echo "bids=${BIDS:-0} wins=${WINS:-0} reveals=${REVEALS:-0}"
          if [ "${BIDS:-0}" -lt 1 ] || [ "${WINS:-0}" -lt 1 ]; then
            echo "builder did not win any bids"; exit 1
          fi
          if [ "${REVEALS:-0}" -ne "${WINS:-0}" ]; then
            echo "builder did not reveal the payloads of all won bids"; exit 1
          fi

          # the beacon node of the validators must have requested bids from the builder API
          # and forwarded the signed blocks that selected them
          SERVED="$(metric 'bc_builder_api_bid_requests_total{result="served"}')"
          SUBMISSIONS="$(metric 'bc_builder_api_block_submissions_total')"
          echo "api_bids_served=${SERVED:-0} api_block_submissions=${SUBMISSIONS:-0}"
          if [ "${SERVED:-0}" -lt 1 ] || [ "${SUBMISSIONS:-0}" -lt 1 ]; then
            echo "builder API was not used by the proposers"; exit 1
          fi

          echo "smoke check passed"

      - name: Collect builder log
        if: always()
        run: docker logs "$BUILDER_CONTAINER" 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' > builder.log || true

      - name: Dump enclave
        if: failure()
        run: kurtosis enclave dump "$ENCLAVE" ./enclave-dump || true

      - name: Upload diagnostics
        # temporarily `always` to see initial logs, switch to `failure()` once stable
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builder-smoke-diagnostics
          path: |
            builder.log
            enclave-dump/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "$BUILDER_CONTAINER" || true
          kurtosis enclave rm -f "$ENCLAVE" || true
          kurtosis engine stop || true
